<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모션 챌린지 v2</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101114;color:#fff;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}header{padding:16px 20px;border-bottom:1px solid #30333a;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}.badge{font-size:12px;background:#252932;padding:7px 10px;border-radius:999px}main{max-width:1400px;margin:auto;padding:16px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}button,.file{border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:15px;cursor:pointer}.file,.secondary{background:#2a2e36;color:#fff}.primary{background:#4c8bf5;color:#fff}input[type=file]{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel,.score{background:#17191e;border:1px solid #30333a;border-radius:15px;overflow:hidden}.panel h2{font-size:16px;margin:0;padding:12px 14px;border-bottom:1px solid #30333a}.stage{position:relative;background:#050505;aspect-ratio:16/10}.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.stage canvas{pointer-events:none}.status{padding:10px 13px;font-size:14px;color:#d2d7df;display:flex;justify-content:space-between;gap:8px}.fps{font-variant-numeric:tabular-nums;color:#8fa0b7}.score{margin-top:14px;padding:15px;display:flex;justify-content:space-between;gap:15px;align-items:center}.score strong{font-size:34px}.hint{font-size:13px;color:#aeb5c1;line-height:1.5}.ok{color:#45e39a}.warn{color:#ffcc66}@media(max-width:850px){.grid{grid-template-columns:1fr}.score{align-items:flex-start;flex-direction:column}}</style></head>
<body><header><h1>🏃 모션 챌린지 — 영상 vs 내 동작</h1><span class="badge">v2 · 실시간 추적 수정</span></header><main>
<div class="controls"><label class="file">① 시범 영상 선택<input id="videoFile" type="file" accept="video/*"></label><button id="cameraBtn" class="primary">② 카메라 시작</button><button id="playBtn" class="secondary">③ 함께 재생</button><button id="resetBtn" class="secondary">초기화</button></div>
<div class="grid"><section class="panel"><h2>🔴 시범 영상 — 빨간 관절</h2><div class="stage"><video id="demo" playsinline controls></video><canvas id="demoCanvas"></canvas></div><div class="status"><span id="demoStatus">시범 영상을 선택하세요.</span><span id="demoFps" class="fps">0 FPS</span></div></section>
<section class="panel"><h2>🟢 나의 동작 — 초록 관절</h2><div class="stage"><video id="cam" playsinline muted></video><canvas id="camCanvas"></canvas></div><div class="status"><span id="camStatus">카메라를 시작하세요.</span><span id="camFps" class="fps">0 FPS</span></div></section></div>
<section class="score"><div><div class="hint">v2에서는 시범 영상과 웹캠에 <b>각각 독립된 포즈 인식기와 반복 루프</b>를 사용합니다. 초록 관절이 몸을 따라 계속 움직이고 FPS 숫자가 변하면 실시간 추적이 정상입니다.</div><div id="message" class="hint warn">AI 모델을 준비하는 중입니다…</div></div><div><span class="hint">동작 일치도</span><br><strong id="score">--</strong></div></section></main>
<script type="module">
import {FilesetResolver,PoseLandmarker,DrawingUtils} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/+esm';
const $=s=>document.querySelector(s),demo=$('#demo'),cam=$('#cam'),dc=$('#demoCanvas'),cc=$('#camCanvas'),dx=dc.getContext('2d'),cx=cc.getContext('2d');
const ds=$('#demoStatus'),cs=$('#camStatus'),df=$('#demoFps'),cf=$('#camFps'),scoreEl=$('#score'),msg=$('#message');
let demoPose=null,camPose=null,stream=null,demoLm=null,camLm=null,demoLoop=false,camLoop=false;let dCount=0,cCount=0,dMark=performance.now(),cMark=dMark;
function fit(v,c){if(v.videoWidth&&v.videoHeight&&(c.width!==v.videoWidth||c.height!==v.videoHeight)){c.width=v.videoWidth;c.height=v.videoHeight}}
function draw(result,c,ctx,color){ctx.clearRect(0,0,c.width,c.height);if(!result?.landmarks?.length)return null;const lm=result.landmarks[0],du=new DrawingUtils(ctx);du.drawConnectors(lm,PoseLandmarker.POSE_CONNECTIONS,{color,lineWidth:4});du.drawLandmarks(lm,{color,radius:3});return lm}
function angle(a,b,c){const x1=a.x-b.x,y1=a.y-b.y,x2=c.x-b.x,y2=c.y-b.y,m=Math.hypot(x1,y1)*Math.hypot(x2,y2);if(!m)return null;return Math.acos(Math.max(-1,Math.min(1,(x1*x2+y1*y2)/m)))*180/Math.PI}
const T=[[11,13,15],[12,14,16],[13,11,23],[14,12,24],[11,23,25],[12,24,26],[23,25,27],[24,26,28]];
function similarity(A,B){if(!A||!B)return null;const d=[];for(const [a,b,c] of T){const x=angle(A[a],A[b],A[c]),y=angle(B[a],B[b],B[c]);if(x!=null&&y!=null)d.push(Math.abs(x-y))}if(!d.length)return null;return Math.max(0,Math.round(100-(d.reduce((s,v)=>s+v,0)/d.length)/90*100))}
function updateScore(){const s=similarity(demoLm,camLm);if(s==null){scoreEl.textContent='--';return}scoreEl.textContent=s+'점';msg.textContent=s>=85?'🎉 아주 비슷해요!':s>=70?'👍 조금만 더 맞춰 보세요.':'👀 시범 동작을 보고 자세를 맞춰 보세요.'}
function fps(which){const now=performance.now();if(which==='d'){dCount++;if(now-dMark>=1000){df.textContent=Math.round(dCount*1000/(now-dMark))+' FPS';dCount=0;dMark=now}}else{cCount++;if(now-cMark>=1000){cf.textContent=Math.round(cCount*1000/(now-cMark))+' FPS';cCount=0;cMark=now}}}
async function makePose(vision){return PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'VIDEO',numPoses:1,minPoseDetectionConfidence:.3,minPosePresenceConfidence:.3,minTrackingConfidence:.3})}
async function init(){try{const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm');[demoPose,camPose]=await Promise.all([makePose(vision),makePose(vision)]);msg.textContent='준비 완료. 먼저 카메라 실시간 추적부터 확인해 보세요.'}catch(e){console.error(e);msg.textContent='AI 모델을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'}}
init();
function runCam(){if(camLoop)return;camLoop=true;const tick=()=>{if(!camLoop)return;if(camPose&&cam.readyState>=2&&!cam.paused){fit(cam,cc);try{const r=camPose.detectForVideo(cam,performance.now());camLm=draw(r,cc,cx,'#22e6a8');cs.textContent=camLm?'🟢 실시간 추적 중':'사람을 찾는 중…';fps('c');updateScore()}catch(e){console.error('cam',e);cs.textContent='웹캠 분석 오류 — F12 콘솔을 확인하세요.'}}requestAnimationFrame(tick)};requestAnimationFrame(tick)}
function runDemo(){if(demoLoop)return;demoLoop=true;const tick=()=>{if(!demoLoop)return;if(demoPose&&demo.readyState>=2&&!demo.paused&&!demo.ended){fit(demo,dc);try{const r=demoPose.detectForVideo(demo,performance.now());demoLm=draw(r,dc,dx,'#ff5252');ds.textContent=demoLm?'🔴 시범 자세 추적 중':'사람을 찾는 중…';fps('d');updateScore()}catch(e){console.error('demo',e);ds.textContent='시범 영상 분석 오류 — F12 콘솔을 확인하세요.'}}requestAnimationFrame(tick)};requestAnimationFrame(tick)}
$('#videoFile').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;demo.src=URL.createObjectURL(f);ds.textContent='시범 영상 준비됨. 함께 재생을 눌러 주세요.'});
$('#cameraBtn').addEventListener('click',async()=>{try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false});cam.srcObject=stream;await cam.play();cs.textContent='카메라 연결됨 — 추적 시작';runCam()}catch(e){console.error(e);cs.textContent='카메라를 열 수 없습니다. 권한을 확인해 주세요.'}});
$('#playBtn').addEventListener('click',async()=>{if(!demo.src){ds.textContent='먼저 시범 영상을 선택하세요.';return}try{demo.currentTime=0;await demo.play();runDemo();if(stream&&cam.paused)await cam.play();runCam()}catch(e){console.error(e);ds.textContent='영상 재생 오류'}});
$('#resetBtn').addEventListener('click',()=>{demo.pause();if(demo.src)demo.currentTime=0;demoLm=camLm=null;dx.clearRect(0,0,dc.width,dc.height);cx.clearRect(0,0,cc.width,cc.height);scoreEl.textContent='--';df.textContent='0 FPS';cf.textContent='0 FPS';msg.textContent='초기화했습니다.'});
</script></body></html>
